    <circle cx="18" cy="18" r="17" stroke="#0f172a" stroke-width="2" fill="#0f172a"/>
    <!-- Inner Lens Ring -->
    <circle cx="18" cy="18" r="10" stroke="#f8fafc" stroke-width="1.75" stroke-dasharray="3.5 1.5"/>
    <!-- Central Scope Axis Reticle -->
