<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  
  <!-- Precision Scope Ring -->
  <circle cx="32" cy="32" r="22" stroke="#f8fafc" stroke-width="2.5" stroke-opacity="0.9"/>
  <circle cx="32" cy="32" r="14" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 2"/>
  
  <!-- Optical Crosshair Markers -->
  <line x1="32" y1="4" x2="32" y2="12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="60" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="4" y1="32" x2="12" y2="32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="60" y2="32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Focal Core -->
  <circle cx="32" cy="32" r="6" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
